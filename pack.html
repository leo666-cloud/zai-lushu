<style>
  :root{
    --bg:#F7F4EE; --card:#fff; --text:#1C1A17; --text2:#55504A; --muted:#928B7F;
    --line:#E6E0D5; --accent:#E4613C;
    --shadow:0 1px 2px rgba(28,26,23,.05), 0 8px 24px -12px rgba(28,26,23,.16);
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121110; --card:#1E1D1A; --text:#F2EFE9; --text2:#BDB6AA;
           --muted:#857D71; --line:#302E29; --accent:#FF7A52;
           --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6); }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; padding:calc(env(safe-area-inset-top,0px) + 24px) 18px 48px;
    background:var(--bg); color:var(--text);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:520px; margin:0 auto; }
  h1{ font-size:25px; font-weight:750; letter-spacing:-.03em; margin:0 0 5px; }
  .sub{ font-size:13px; color:var(--muted); margin-bottom:22px; line-height:1.65; }
  .card{
    display:flex; gap:0; align-items:stretch; width:100%; text-align:left;
    background:var(--card); border:0; border-radius:20px; padding:0;
    box-shadow:var(--shadow); overflow:hidden; margin-bottom:13px;
    color:inherit; font:inherit; cursor:pointer;
    transition:transform .16s cubic-bezier(.2,.8,.3,1);
  }
  .card:active{ transform:scale(.983); }
  .cover{ width:92px; flex:none; display:grid; place-items:center; font-size:34px;
          filter:brightness(1); text-shadow:0 2px 8px rgba(0,0,0,.2); }
  .body{ flex:1; min-width:0; padding:14px 14px 14px 15px; }
  .title{ font-size:16px; font-weight:670; letter-spacing:-.015em; }
  .meta{ font-size:12.5px; color:var(--muted); margin-top:4px; }
  .note{ font-size:11.5px; color:var(--accent); margin-top:7px; font-weight:560; }
  .arrow{ display:grid; place-items:center; padding-right:14px; color:var(--muted);
          font-size:24px; font-weight:300; }
  .hint{
    margin-top:22px; padding:13px 15px; border-radius:13px;
    background:var(--card); font-size:12.5px; color:var(--text2); line-height:1.7;
    box-shadow:var(--shadow);
  }
  .hint b{ color:var(--text); }
  .done{
    position:fixed; left:50%; bottom:34px; transform:translate(-50%,14px);
    background:rgba(28,26,23,.93); color:#fff; padding:10px 18px; border-radius:99px;
    font-size:13.5px; opacity:0; pointer-events:none; transition:.24s;
  }
  .done.show{ opacity:1; transform:translate(-50%,0); }
  @media (prefers-color-scheme: dark){ .done{ background:rgba(242,239,233,.94); color:#1C1A17; } }
</style>
</head>
